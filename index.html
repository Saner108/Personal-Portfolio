    <meta name="description" content="Cesar Sanchez — Business Analytics & Finance student at TAMUCC. Data analyst with hands-on SQL, Power BI, Excel modeling, and AI product experience. Available for data analyst internships and analytics roles." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://personal-brand-six-coral.vercel.app/" />
    <meta property="og:title" content="Cesar Sanchez | Business Analytics & Data Analysis" />
    <meta property="og:description" content="Turning raw data into decisions — SQL pipelines, financial models, Power BI dashboards, and AI-powered tools." />
    <meta property="og:image" content="https://personal-brand-six-coral.vercel.app/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Cesar Sanchez — Business Analytics & Data Analysis" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cesar Sanchez | Business Analytics & Data Analysis" />
    <meta name="twitter:description" content="Turning raw data into decisions — SQL pipelines, financial models, Power BI dashboards, and AI-powered tools." />
    <meta name="twitter:image" content="https://personal-brand-six-coral.vercel.app/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://personal-brand-six-coral.vercel.app/" />

    <!-- Hero headshot: preload so browser fetches it during HTML parse, not
         after JS executes. Biggest single LCP win available. -->
    <link rel="preload" as="image" href="/images/headshot.jpg" fetchpriority="high" />

    <!-- Font connections: establish early so both font sources are ready
         before the browser needs them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <!-- Inter (body) — Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- General Sans (display) — Fontshare
         Use a <link> tag instead of CSS @import: @import is render-blocking
         and can't be discovered until the CSS file is parsed; a <link> in
         <head> is discovered during HTML parse and fetched in parallel. -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
